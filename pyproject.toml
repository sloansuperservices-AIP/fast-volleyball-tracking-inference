[project]
name = "fast-volleyball-tracking-inference"
version = "0.1.0"
description = "Fast Volleyball Tracking Inference with Multi-Engine Support"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "celery[redis]>=5.5.3",
    "ffmpeg-python>=0.2.0",
    "filterpy>=1.4.5",
    "openvino>=2025.3.0",
    "onnxruntime>=1.22.0",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.1",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "ultralytics>=8.4.36",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
