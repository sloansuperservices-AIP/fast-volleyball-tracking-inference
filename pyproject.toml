[project]
name = "fast-volleyball-tracking-inference"
version = "0.1.0"
description = "Fast Volleyball Ball Tracking Inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filterpy>=1.4.5",
    "onnxruntime>=1.20.0",
    "opencv-contrib-python>=4.10.0.84",
    "opencv-python>=4.10.0.84",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "ultralytics>=8.2.0",
    "matplotlib>=3.8.0",
]


[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.20.0",
]
