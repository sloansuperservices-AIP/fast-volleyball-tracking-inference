[project]
name = "fast-volleyball-tracking-inference"
version = "0.1.0"
description = "Volleyball tracking inference (headless, Docker-friendly)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "celery[redis]>=5.5.3",
    "ffmpeg-python>=0.2.0",
    "filterpy>=1.4.5",
    "openvino>=2025.3.0",
    "onnxruntime>=1.22.0",
    "opencv-python-headless>=4.10.0",
    "pandas>=2.3.1",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "ultralytics>=8.0.0",
    "matplotlib>=3.7.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
# For cases when GPU fallback via ONNX (CUDA) is needed
gpu = [
    "onnxruntime-gpu>=1.22.0",
]

# Only for local development / debugging / visualization (GUI, notebooks, etc.)
dev = [
    "opencv-contrib-python>=4.12.0.88",  # full version with contrib modules and GUI (if SIFT etc. is needed)
    "opencv-python>=4.12.0.88",          # or just opencv-python if contrib is not needed
    "pyqt5>=5.15.11",                    # ← GUI library moved here
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.9",                   # sometimes useful instead of/together with seaborn
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
